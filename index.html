<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
</head>
<body>
  <h1>Quiz App</h1>

  <div>
    <h1 id="question"></h1>

    <div class="answer-buttons-container">
      <button id="option1" class="options">1</button>
      <button id="option2" class="options">2</button>
      <button id="option3" class="options">3</button>
      <button id="option4" class="options">4</button>
    </div>

    <h3 id="userSelection"></h3>

    <div id="feedback"></div>

    <button id="nextquestion" class="Submit">Next Question</button>
  </div>

  <ul id="quizApp"></ul>

  <script src="./quizApp.js"></script>
</body>
</html>
